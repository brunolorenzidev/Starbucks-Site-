<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;500;900&display=swap" rel="stylesheet">

    <title> Starbucks </title>


</head>

<body>
    <div class="circulo"></div>
    <img src="logo.png" class="logo">

    <div class="conteudo">
        <div class="caixa-texto">

            <h2>I'ts not just Coffee<br>I'ts <span>Starbucks</span></h2>
            <p>Whether you're searching for something new to warm your mug, seeking the best brew method for your
                favorite blend or exploring our rarest offerings, you've come to the right place.</p>

            <button>Saiba Mais</button>

        </div>

        <div class="caixa-imagem">

            <img src="img1.png" class="Starbucks">

        </div>
    </div>

    <div class="menu">
        <img src="img-pequena1.png" class="botao-menu" onclick="trocaimagem('img1.png'); trocacor('#017143') ">
        <img src="img-pequena2.png" class="botao-menu" onclick="trocaimagem('img2.png'); trocacor('#eb7495') ">
        <img src="img-pequena3.png" class="botao-menu" onclick="trocaimagem('img3.png'); trocacor('#d752b1') ">

    </div>




</body>
<script>
    let imagem = document.querySelector(".Starbucks")
    let circulo = document.querySelector(".circulo")

    function trocaimagem(endereco) {
        imagem.src = endereco
        console.log(imagem)
    }
function trocacor(cor) {
    circulo.style.background = cor 

}

</script>

</html>
